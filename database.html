<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Kurta Palace Database</title>
    <!-- Load Tailwind CSS for beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .highlight {
            /* Custom highlight style for the search result */
            background-color: #fff3cd; /* Light yellow background */
            font-weight: 600;
            border-left: 5px solid #ffc107; /* Yellow border */
        }
        /* Custom scrollbar for the table container */
        .scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: #a0a0a0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <header class="text-center mb-10 p-6 bg-[rgb(107,10,24)] text-white rounded-xl shadow-lg">
            <!-- UPDATED: Lighter golden text color: rgb(212, 175, 55) -->
            <h1 class="text-4xl font-bold tracking-tight text-[rgb(212,175,55)]">👑 Royal Kurta Palace Database</h1>
            <p class="mt-1 text-lg opacity-90">Customer Orders Management System</p>
        </header>

        <!-- Main Content Grid -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- 1. Add New Order Form -->
            <div id="form-card" class="lg:col-span-1 bg-white p-6 rounded-xl shadow-2xl h-fit sticky top-8">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800 border-b pb-3">Add New Order</h2>
                <form id="addOrderForm" class="space-y-4">
                    <div>
                        <label for="orderDate" class="block text-sm font-medium text-gray-700">Date</label>
                        <!-- UPDATED: Lighter golden focus ring/border -->
                        <input type="date" id="orderDate" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-[rgb(212,175,55)] focus:ring focus:ring-[rgb(212,175,55)] focus:ring-opacity-50">
                    </div>
                    <div>
                        <label for="customerName" class="block text-sm font-medium text-gray-700">Customer Name</label>
                        <!-- UPDATED: Lighter golden focus ring/border -->
                        <input type="text" id="customerName" required placeholder="Enter full name" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-[rgb(212,175,55)] focus:ring focus:ring-[rgb(212,175,55)] focus:ring-opacity-50">
                    </div>
                    <div>
                        <label for="orderNumber" class="block text-sm font-medium text-gray-700">Order Number</label>
                        <!-- UPDATED: Lighter golden focus ring/border -->
                        <input type="text" id="orderNumber" required placeholder="e.g., RKP-2025-001" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-[rgb(212,175,55)] focus:ring focus:ring-[rgb(212,175,55)] focus:ring-opacity-50">
                    </div>
                    <!-- UPDATED: Lighter golden text, hover BG, and focus ring -->
                    <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-lg shadow-md text-[rgb(212,175,55)] bg-[rgb(107,10,24)] hover:bg-[rgb(212,175,55)] hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[rgb(212,175,55)] transition ease-in-out duration-150 font-semibold">
                        Save Order
                    </button>
                    <p id="saveMessage" class="text-center text-sm mt-3 hidden"></p>
                </form>
            </div>

            <!-- 2. Search and Results Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-2xl">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800 border-b pb-3">Search & View Orders</h2>

                <!-- Search Bar -->
                <div class="mb-6">
                    <input type="text" id="searchTerm" placeholder="Search by Customer Name or Order Number..." class="w-full rounded-lg border-gray-300 shadow-md p-4 text-lg focus:border-red-500 focus:ring focus:ring-red-500 focus:ring-opacity-50" oninput="filterTable()">
                </div>

                <!-- Database Status/Loading -->
                <div id="status" class="p-3 bg-red-100 text-red-700 rounded-lg mb-4 text-sm font-medium">
                    [CRITICAL ERROR] Failed to initialize database. Check console.
                </div>

                <!-- Results Table -->
                <div class="overflow-x-auto scroll-container shadow-inner rounded-lg border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order Number</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-100">
                            <!-- Data will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Empty state message -->
                <div id="emptyState" class="hidden text-center p-8 text-gray-500">
                    <p class="text-xl">No orders found yet!</p>
                    <p class="mt-2 text-sm">Use the form on the left to add your first customer order.</p>
                </div>

            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Log level set to debug for easier troubleshooting
        setLogLevel('Debug');

        // --- GLOBAL SETUP (FIXED FOR LOCAL RUNNING) ---
        // 🚨 CONFIGURATION MUST BE CHECKED. THE API KEY BELOW IS CAUSING THE 'auth/api-key-not-valid' ERROR 🚨
        const localFirebaseConfig = {
            // !!! PLEASE REPLACE THIS apiKey WITH THE CORRECT ONE FROM YOUR FIREBASE CONSOLE !!!
            apiKey: "AIzaSyBf08bJK22t_ggyHj2zjGj2NO-F8oABo-o", 
            authDomain: "customer-database-5c4d1.firebaseapp.com",
            projectId: "customer-database-5c4d1",
            storageBucket: "customer-database-5c4d1.firebasestorage.app", 
            messagingSenderId: "210281601651",
            // New App ID and Measurement ID provided by user
            appId: "1:210281601651:web:267a9a45e765c56fbea806", 
            measurementId: "G-GKVGB9PWZZ"
        };
        
        // This logic checks if Canvas credentials exist. If not (when running locally), it uses the local config above.
        const appId = typeof __app_id !== 'undefined' ? __app_id : localFirebaseConfig.projectId;
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : JSON.stringify(localFirebaseConfig));
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db;
        let auth;
        let userId = null;
        let allOrders = []; // Array to hold all fetched orders

        const ordersTableBody = document.getElementById('ordersTableBody');
        const statusDiv = document.getElementById('status');
        const emptyStateDiv = document.getElementById('emptyState');
        const saveMessage = document.getElementById('saveMessage');

        // --- INITIALIZATION FUNCTION ---
        async function initializeFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication using custom token or anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    // For local use, we sign in anonymously as we don't have the initialAuthToken
                    // NOTE: This is where the API Key validation happens!
                    await signInAnonymously(auth); 
                }

                userId = auth.currentUser?.uid || crypto.randomUUID();
                // User ID ka pura string show kar rahe hain for debugging
                statusDiv.textContent = `Database Ready. User ID: ${userId}`; 
                statusDiv.classList.replace('bg-red-100', 'bg-green-100');
                statusDiv.classList.replace('text-red-700', 'text-green-700');

                // Start listening for real-time data updates
                startRealtimeListener();

            } catch (error) {
                console.error("Firebase Initialization or Auth Error:", error);
                // Status message ko clear aur helpful bana rahe hain
                statusDiv.textContent = `[CRITICAL ERROR] Initialization Failed: ${error.code || 'Unknown Error'}. Please check your API Key and Firebase Rules.`;
                statusDiv.classList.replace('bg-green-100', 'bg-red-100');
                statusDiv.classList.replace('text-green-700', 'text-red-700');
            }
        }

        // --- REAL-TIME DATA LISTENER ---
        function startRealtimeListener() {
            if (!db || !userId) return;

            // Define the private collection path
            const ordersCollectionPath = `artifacts/${appId}/users/${userId}/customer_orders`;
            const ordersRef = collection(db, ordersCollectionPath);

            // Set up real-time listener
            onSnapshot(ordersRef, (snapshot) => {
                allOrders = []; // Clear current list
                snapshot.forEach((doc) => {
                    allOrders.push({ id: doc.id, ...doc.data() });
                });

                // Immediately re-render the table with new data
                renderOrders(allOrders, document.getElementById('searchTerm').value.toLowerCase());
            }, (error) => {
                console.error("Error fetching documents: ", error);
                // Agar yahan error aaya, toh woh rules ka masla hoga
                statusDiv.textContent = `[ERROR] Could not load orders. Check Firestore Rules.`;
                statusDiv.classList.replace('bg-green-100', 'bg-red-100');
                statusDiv.classList.replace('text-green-700', 'text-red-700');
            });
        }

        // --- ADD RECORD FUNCTION ---
        document.getElementById('addOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!db || !userId) {
                saveMessage.textContent = 'Database not ready. Please wait.';
                saveMessage.classList.remove('hidden');
                saveMessage.classList.add('text-red-500');
                return;
            }

            const newOrder = {
                date: document.getElementById('orderDate').value,
                name: document.getElementById('customerName').value.trim(),
                order_number: document.getElementById('orderNumber').value.trim(),
                timestamp: new Date().toISOString()
            };

            try {
                // Define the private collection path
                const ordersCollectionPath = `artifacts/${appId}/users/${userId}/customer_orders`;
                await addDoc(collection(db, ordersCollectionPath), newOrder);

                saveMessage.textContent = '✅ Order saved successfully!';
                saveMessage.classList.remove('text-red-500', 'text-yellow-500');
                saveMessage.classList.add('text-green-500');
                saveMessage.classList.remove('hidden');

                // Clear the form and reset message after a delay
                document.getElementById('addOrderForm').reset();
                setTimeout(() => {
                    saveMessage.classList.add('hidden');
                }, 3000);

            } catch (error) {
                console.error("Error adding document: ", error);
                saveMessage.textContent = `❌ Error saving order. Check your Firebase Rules.`;
                saveMessage.classList.remove('hidden');
                saveMessage.classList.add('text-red-500');
            }
        });

        // --- DELETE RECORD FUNCTION ---
        window.deleteRecord = async (docId) => {
            if (!db || !userId) return;

            // Simple check instead of a proper modal
            if (!window.confirm(`Are you sure you want to delete order ${docId}?`)) {
                return;
            }

            try {
                const docPath = `artifacts/${appId}/users/${userId}/customer_orders/${docId}`;
                await deleteDoc(doc(db, docPath));
                // The onSnapshot listener will automatically update the table
            } catch (error) {
                console.error("Error deleting document: ", error);
                // Yahan bhi error rules ya network ki wajah se aata hai
                // Replacing alert() with console log, as per best practices (or using a custom modal if needed)
                console.error('Failed to delete order. Check console.'); 
            }
        };

        // --- RENDER & FILTER FUNCTION ---
        window.filterTable = () => {
            const searchTerm = document.getElementById('searchTerm').value.toLowerCase();
            renderOrders(allOrders, searchTerm);
        }

        function renderOrders(orders, searchTerm) {
            ordersTableBody.innerHTML = ''; // Clear previous results
            const filteredOrders = [];

            // 1. Filter the orders based on search term (if any)
            const term = searchTerm.toLowerCase().trim();
            
            if (term === '') {
                // If no search term, show all orders
                filteredOrders.push(...orders);
            } else {
                // Filter by name or order number
                orders.forEach(order => {
                    if (order.name.toLowerCase().includes(term) || order.order_number.toLowerCase().includes(term)) {
                        filteredOrders.push(order);
                    }
                });
            }
            
            // 2. Display the data
            if (filteredOrders.length === 0) {
                ordersTableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500">No matching orders found.</td></tr>`;
                emptyStateDiv.classList.toggle('hidden', orders.length > 0);
                return;
            }
            
            emptyStateDiv.classList.add('hidden');

            filteredOrders.forEach(order => {
                const isHighlighted = (order.name.toLowerCase().includes(term) && term.length > 0) || 
                                      (order.order_number.toLowerCase().includes(term) && term.length > 0);
                
                const row = document.createElement('tr');
                row.className = `transition-all duration-200 hover:bg-gray-50 ${isHighlighted ? 'highlight' : ''}`;
                
                // Helper function to safely highlight text parts
                const highlightText = (text, term) => {
                    if (!term) return text;
                    const parts = text.split(new RegExp(`(${term})`, 'gi'));
                    return parts.map(part => 
                        part.toLowerCase() === term.toLowerCase() ? `<span class="bg-yellow-200 font-bold">${part}</span>` : part
                    ).join('');
                };

                // Use highlightText for rendering
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${order.date}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${highlightText(order.name, term)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${highlightText(order.order_number, term)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="deleteRecord('${order.id}')" class="text-red-600 hover:text-red-900 transition-colors">
                            Delete
                        </button>
                    </td>
                `;
                ordersTableBody.appendChild(row);
            });
        }
        
        // Ensure date field defaults to today
        document.getElementById('orderDate').valueAsDate = new Date();

        // Start the application
        initializeFirebase();

    </script>
</body>
</html>
